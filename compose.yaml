services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_PATH: /app/data/story-shop.sqlite3
      STORY_PATH: ${STORY_PATH:-/app/stories/demo.json}
      AI_MODE: ${AI_MODE:-mock}
      AI_PROVIDER_FACTORY: ${AI_PROVIDER_FACTORY:-}
      AI_MAX_PARALLEL: ${AI_MAX_PARALLEL:-4}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-10}
      AI_DAILY_CALL_LIMIT: ${AI_DAILY_CALL_LIMIT:-200}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-16384}
      REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:-120}
      SESSION_CREATES_PER_HOUR: ${SESSION_CREATES_PER_HOUR:-10}
      CHATS_PER_MINUTE: ${CHATS_PER_MINUTE:-30}
      MAX_SESSIONS: ${MAX_SESSIONS:-1000}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-2592000}
      MAX_COMMANDS_PER_SESSION: ${MAX_COMMANDS_PER_SESSION:-1000}
      MAX_DATABASE_BYTES: ${MAX_DATABASE_BYTES:-536870912}
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-3600}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - story-data:/app/data
    restart: unless-stopped
volumes:
  story-data:
